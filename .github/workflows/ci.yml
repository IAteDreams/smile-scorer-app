name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Placeholders that pass lib/env.ts validation; CI never calls real services.
    # Swap a value for ${{ secrets.NAME }} only when a test needs the live service.
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 465
      SMTP_USER: placeholder
      SMTP_PASSWORD: placeholder
      EMAIL_FROM: Smilescore <ci@example.test>
      POSTGRES_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      KV_REST_API_URL: https://placeholder.upstash.io
      KV_REST_API_TOKEN: placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      SUPABASE_SECRET_KEY: placeholder
      SUPABASE_PHOTO_BUCKET: smile-scorer-pictures
      AWS_ACCESS_KEY_ID: placeholder
      AWS_SECRET_ACCESS_KEY: placeholder
      AWS_REGION: us-east-1
      USE_MOCK_SCORER: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # No build step here: the e2e job runs a full production build.

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The Playwright config starts fake Redis/Storage/SMTP and a production
    # build of the app; only Postgres comes from a service container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smile
          POSTGRES_PASSWORD: smile
          POSTGRES_DB: smile_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U smile -d smile_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://smile:smile@localhost:54329/smile_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
